name: Quantum model CPU smoke test
on:
  push:
    branches: [quantum-cloud-migration]
    paths:
      - ".github/workflows/quantum-model-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact pinned llama.cpp inference revision
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 19cce6919992fdffd92e0ac152caaf1e2b8f254e
          path: llama.cpp
      - name: Build the production CPU inference server
        working-directory: llama.cpp
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_METAL=OFF -DGGML_NATIVE=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DLLAMA_BUILD_TESTS=OFF
          cmake --build build --config Release --target llama-server -j2
          test -s build/bin/llama-server
      - name: Acquire and verify the pinned SmolLM2 Q8 model
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama-smoke.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then break; fi
            sleep 2
          done
          ollama pull smollm2:135m-instruct-q8_0
          digest=$(curl -fsS http://127.0.0.1:11434/api/tags | jq -r '.models[] | select(.name == "smollm2:135m-instruct-q8_0").digest')
          expected="2d470404841a51320639b2c2418c7ad8643cccbbcb88c2a242b211ae83bf46a9"
          test "$digest" = "$expected"
          ollama show --modelfile smollm2:135m-instruct-q8_0 > /tmp/Quantum.Modelfile
          model_path=$(awk '/^FROM / {print $2; exit}' /tmp/Quantum.Modelfile)
          test -s "$model_path"
          cp "$model_path" /tmp/smollm2-135m-instruct-q8.gguf
          echo "Verified Ollama manifest digest: $digest"
      - name: Run the exact llama.cpp CPU server and generate a real answer
        shell: bash
        run: |
          set -euo pipefail
          llama.cpp/build/bin/llama-server -m /tmp/smollm2-135m-instruct-q8.gguf -c 2048 -t 4 -tb 4 -ngl 0 --host 127.0.0.1 --port 8080 > /tmp/quantum-llama-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = "1"
          python3 - <<'PY'
          import json, urllib.request
          payload=json.dumps({
              "model":"smollm2-135m-instruct",
              "messages":[{"role":"user","content":"In one short sentence, say hello and identify yourself as SmolLM2."}],
              "max_tokens":64,
              "temperature":0
          }).encode()
          request=urllib.request.Request(
              "http://127.0.0.1:8080/v1/chat/completions",
              data=payload,
              headers={"Content-Type":"application/json"},
              method="POST"
          )
          with urllib.request.urlopen(request,timeout=600) as response:
              result=json.loads(response.read())
          answer=result.get("choices",[{}])[0].get("message",{}).get("content","").strip()
          if not answer:
              raise SystemExit("FAIL: production llama.cpp server returned an empty response")
          print("PASS: pinned llama.cpp CPU server loaded the checksum-pinned SmolLM2 GGUF and generated text.")
          print("Sample response:",answer[:500])
          PY
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
