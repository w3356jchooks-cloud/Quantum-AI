name: Quantum build and type checks
on:
  push:
    branches: [main, quantum-cloud-migration]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check app and Pages Functions
        run: npm run typecheck
      - name: Build browser application
        run: npm run build
