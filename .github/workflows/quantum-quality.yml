name: Quantum quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "quantum/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantum-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check all application layers
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build browser TypeScript
        run: npm run build
