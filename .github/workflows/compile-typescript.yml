name: Compile Quantum TypeScript

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**/*.ts"
      - "tsconfig*.json"
      - "package.json"
  push:
    branches: [main, "quantum/**"]
    paths:
      - "src/**/*.ts"
      - "tsconfig*.json"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: quantum-typescript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compile TypeScript
        run: npm run build
