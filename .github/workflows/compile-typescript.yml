name: Compile Quantum TypeScript

on:
  push:
    branches: [main]
    paths:
      - "src/**/*.ts"
      - "tsconfig*.json"
      - ".github/workflows/compile-typescript.yml"

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile TypeScript
        run: |
          npm install --global typescript@5.8.3
          tsc -p tsconfig.app.json
          tsc -p tsconfig.worker.json
      - name: Commit browser JavaScript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/engine.worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Build browser JavaScript from TypeScript"
            git pull --rebase origin main
            git push
          fi
