name: Quantum build and type checks
on:
  push:
    branches: [main, quantum-cloud-migration]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check app and Pages Functions
        run: npm run typecheck
      - name: Validate D1 schema SQL
        run: python3 -c "import sqlite3; db=sqlite3.connect(':memory:'); db.executescript(open('schema.sql').read()); print('D1 schema SQL is valid.')"
      - name: Run security and integration unit tests
        run: npm test
      - name: Build browser application
        run: npm run build
      - name: Verify deployable Pages output
        run: |
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/src/app.js
          test -s dist/_headers
          ! grep -R -i -E 'hugging.?face|transformers\.js|onnxruntime' dist
